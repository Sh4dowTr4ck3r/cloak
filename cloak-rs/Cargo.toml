[package]
name = "cloak-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "cloak_rs"
path = "src/lib.rs"

[[bin]]
name = "cloak-rs"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5"
hex = "0.4.3"
md-5 = "0.11.0"
same-file = "1.0.6"
sha1 = "0.11.0"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
